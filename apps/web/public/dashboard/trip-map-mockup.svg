<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map mockup of selected trip">
  <!-- Base land -->
  <rect width="800" height="500" fill="#F2EFE6" />

  <!-- Park / green block -->
  <path d="M 560 60 Q 700 90 720 200 Q 740 290 660 320 Q 580 330 560 260 Q 540 180 560 60 Z" fill="#E1DDCD" />
  <path d="M 60 360 Q 180 340 240 380 Q 300 420 250 460 Q 180 480 80 460 Q 40 420 60 360 Z" fill="#E1DDCD" />

  <!-- River -->
  <path d="M -20 380 Q 200 350 380 400 T 820 360" stroke="#D6D3C6" stroke-width="22" fill="none" stroke-linecap="round" />

  <!-- Street grid -->
  <g stroke="#D7D2C2" stroke-width="2.5" fill="none">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="440" x2="800" y2="440" />
    <line x1="120" y1="0" x2="120" y2="500" />
    <line x1="220" y1="0" x2="220" y2="500" />
    <line x1="360" y1="0" x2="360" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Major boulevard -->
  <g stroke="#C8C0A8" fill="none">
    <line x1="0" y1="250" x2="800" y2="250" stroke-width="9" />
    <line x1="0" y1="250" x2="800" y2="250" stroke="#EFEADC" stroke-width="2" stroke-dasharray="14 12" />
  </g>

  <!-- Diagonal road -->
  <line x1="80" y1="500" x2="540" y2="0" stroke="#D7D2C2" stroke-width="2.5" />

  <!-- Route casing (subtle outline behind the route for legibility) -->
  <path d="M 160 400 L 160 250 L 360 250 L 360 160 L 500 160 L 500 100 L 640 100"
        stroke="#FFFFFC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />

  <!-- Route line  brand primary -->
  <path d="M 160 400 L 160 250 L 360 250 L 360 160 L 500 160 L 500 100 L 640 100"
        stroke="#F34213" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Origin marker -->
  <g transform="translate(160 400)">
    <circle r="16" fill="#FFFFFC" stroke="#F34213" stroke-width="4" />
    <circle r="6" fill="#F34213" />
  </g>

  <!-- Destination marker (pin) -->
  <g transform="translate(640 100)">
    <ellipse cx="0" cy="22" rx="10" ry="3" fill="#000000" opacity="0.18" />
    <path d="M 0 -24 C 12 -24 18 -14 18 -6 C 18 8 0 22 0 22 C 0 22 -18 8 -18 -6 C -18 -14 -12 -24 0 -24 Z"
          fill="#F34213" stroke="#B7320D" stroke-width="1.5" />
    <circle r="6" cy="-8" fill="#FFFFFC" />
  </g>
</svg>
